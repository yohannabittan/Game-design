<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Range Sketch</title>
<style>
html,body{margin:0;height:100%;background:#2b1d12;overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style></head><body><canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=874,H=402,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;layout();}
const T={shrink:0.85,baseR:44,minR:7,misses:3,drawT:0.6,knifeT:0.25,arrowT:0.14,swayFrom:5,drag:20,lift:50,
 marks:[0.52,0.68,0.84],markNames:['NEAR','MID','FAR'],arc:34,
 fruits:[
  {n:'PUMPKIN',R:30,k:'pumpkin',j:['#f08a24','#ffb347','#d96a10']},
  {n:'WATERMELON',R:27,k:'melon',j:['#d63b4a','#3f9a3f','#e8f5d0']},
  {n:'PINEAPPLE',R:21,k:'pine',j:['#f5d442','#ffe680','#e0b020']},
  {n:'POMEGRANATE',R:17,k:'pom',j:['#b3262e','#d8323c','#8c1c24']},
  {n:'APPLE',R:13,k:'apple',j:['#ffffff','#9ed65a','#e9f5c9']}],
 appleSwayFrom:2,appleSway:5,appleSwayStep:5,appleSwayMax:46,
 pot:{R:15,shrink:0.85,minR:7,close:0.12,closeMin:0.78},
 wheel:{R:100,speed:0.6,step:0.35,potR:13,shrink:0.92,minR:8}};
const MODES=[{id:'targets',label:'TARGETS',unit:'targets hit',sc:'SCORE'},{id:'apple',label:'APPLE SHOT',unit:'fruits hit',sc:'FRUITS'},
 {id:'board',label:'KNIFE BOARD',unit:'pots burst',sc:'POTS'},{id:'wheel',label:'WHEEL',unit:'pots burst',sc:'POTS'}];
let GY,HAND,BTN={tabs:[]},FARX,BX,WX,WY;
function layout(){
  GY=Math.round(H*0.78);
  HAND={x:Math.round(W*0.17),y:GY-92};
  FARX=Math.round(W*T.marks[2]);BX=Math.round(W*0.76);WX=BX;WY=GY-T.wheel.R-6;
  const gap=6,tw=(W-20-gap*3)/4;
  BTN.tabs=MODES.map((m,i)=>({id:m.id,x:10+i*(tw+gap),y:4,w:tw,h:40}));
  BTN.knife={x:10,y:H-54,w:92,h:44};
  BTN.bow={x:108,y:H-54,w:92,h:44};
  BTN.retry={x:W/2-70,y:H/2+22,w:140,h:48};
}
// ---- storage
function bestKey(){return 'range2_'+(S.mode==='targets'?'targets_'+S.weapon:S.mode)}
function loadBest(){try{return +localStorage.getItem(bestKey())||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem(bestKey(),String(v))}catch(e){}}
// ---- audio
let AC=null;
function audioInit(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();}catch(e){}}
function noise(dur,fT,fE,vol,type){if(!AC)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(fT,AC.currentTime);f.frequency.exponentialRampToValueAtTime(fE,AC.currentTime+dur);
  const v=AC.createGain();v.gain.value=vol;s.connect(f);f.connect(v);v.connect(AC.destination);s.start();}
function tone(f0,f1,dur,vol,type,vib){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,AC.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),AC.currentTime+dur);
  v.gain.setValueAtTime(vol,AC.currentTime);v.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=38;lg.gain.value=f0*0.05;l.connect(lg);lg.connect(o.frequency);l.start();l.stop(AC.currentTime+dur);}
  o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}
const SFX={
 whoosh(){noise(0.22,500,2400,0.18,'bandpass')},
 thunk(){tone(170,45,0.16,0.5,'sine');noise(0.08,900,200,0.2,'lowpass')},
 twang(){tone(240,180,0.35,0.22,'sawtooth',true)},
 creak(){tone(90,140,0.6,0.04,'triangle')},
 tick(){tone(1400,1400,0.04,0.05,'square')},
 miss(){tone(200,90,0.22,0.12,'triangle')},
 soon(){tone(150,110,0.18,0.14,'square')},
 ding(){tone(880,1320,0.18,0.12,'triangle')},
 end(){tone(330,110,0.6,0.15,'sawtooth')},
 splat(){noise(0.28,1800,200,0.3,'lowpass');tone(300,120,0.12,0.15,'sine')},
 crack(){noise(0.16,2600,500,0.25,'bandpass');tone(520,260,0.08,0.12,'square')},
 ow(){tone(560,240,0.4,0.2,'square',true)},
 thud(){tone(110,40,0.22,0.5,'sine')}
};
// ---- rng
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---- state
const S={mode:'targets',weapon:'knife',raised:false,run:null,thumb:null,proj:[],fx:[],t:0,shake:0,hint:{txt:'',t:0}};
function weapon(){return S.mode==='apple'?'bow':S.mode==='targets'?S.weapon:'knife'}
function modeInfo(){return MODES.find(m=>m.id===S.mode)}
const IDENT={ox:0,oy:0,rot:0,sc:1};
function newRun(){
  S.proj=[];S.fx=[];
  S.run={score:0,misses:0,state:'ready',timer:0,rng:mulberry((Math.random()*1e9)|0),newBest:false,stuck:[],idx:0,lvl:0,why:'',loose:[],after:null,pots:[],pf:IDENT,fig:null,target:null,fruit:null,wheel:null};
  if(S.mode==='targets')spawnTarget();
  else if(S.mode==='apple'){S.run.fig=mkFig('stand',FARX,GY+2);spawnFruit();}
  else if(S.mode==='board')buildBoard();
  else buildWheel();
}
// ---- figure (a friendly man in a tunic)
function mkFig(type,ox,oy){return{type,ox,oy,by:oy,rot:0,sc:1,hurt:false,hurtT:0,landed:false,nerv:false,ph:Math.random()*6}}
function poseParts(type){
  switch(type){
    case 'board':return{head:[0,-104,13],sh:[0,-88],hip:[0,-50],arms:[[-12,-86,-54,-76],[12,-86,54,-76]],legs:[[-6,-50,-22,-2],[6,-50,22,-2]]};
    case 'wheel':return{head:[0,-52,12],sh:[0,-36],hip:[0,6],arms:[[-8,-33,-62,-22],[8,-33,62,-22]],legs:[[-5,6,-36,60],[5,6,36,60]]};
    case 'sit':return{head:[-2,-50,13],sh:[0,-36],hip:[0,-8],arms:[[-10,-34,-32,-10],[10,-34,28,-8]],legs:[[-4,-8,-42,-4],[4,-8,-36,2]]};
    default:return{head:[0,-104,13],sh:[0,-88],hip:[0,-50],arms:[[-12,-86,-19,-52],[12,-86,19,-52]],legs:[[-6,-50,-10,-2],[6,-50,10,-2]]};
  }
}
function toWorld(f,lx,ly){const c=Math.cos(f.rot),s=Math.sin(f.rot);return{x:f.ox+(lx*c-ly*s)*f.sc,y:f.oy+(lx*s+ly*c)*f.sc}}
function toLocal(f,x,y){const c=Math.cos(f.rot),s=Math.sin(f.rot),dx=x-f.ox,dy=y-f.oy;return{x:(dx*c+dy*s)/f.sc,y:(-dx*s+dy*c)/f.sc}}
function segD(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let k=l?((px-x1)*dx+(py-y1)*dy)/l:0;k=Math.max(0,Math.min(1,k));return Math.hypot(px-(x1+k*dx),py-(y1+k*dy))}
function figHit(f,x,y){
  const P=poseParts(f.type),l=toLocal(f,x,y),pad=2;
  if(Math.hypot(l.x-P.head[0],l.y-P.head[1])<=P.head[2]+pad)return true;
  if(segD(l.x,l.y,P.sh[0],P.sh[1],P.hip[0],P.hip[1]+10)<=15+pad)return true;
  for(const a of P.arms)if(segD(l.x,l.y,a[0],a[1],a[2],a[3])<=5+pad)return true;
  for(const a of P.legs)if(segD(l.x,l.y,a[0],a[1],a[2],a[3])<=6+pad)return true;
  return false;
}
// ---- target mode
function spawnTarget(){
  const r=S.run,R=Math.max(T.minR,T.baseR*Math.pow(T.shrink,r.idx)),mark=r.idx%3;
  const x=W*T.marks[mark]+(r.rng()-0.5)*16;
  const top=Math.max(100+R,GY-175),bot=GY-R-24;
  const y=top+r.rng()*Math.max(0,bot-top);
  const sw=r.idx>=T.swayFrom?Math.min(38,5+(r.idx-T.swayFrom)*3.5):0;
  r.target={x,y,R,sw,ph:r.rng()*6.28,born:S.t,mark};r.stuck=[];r.state='ready';
}
function tpos(t,time){const dx=t.sw?Math.sin((time||S.t)*1.5+t.ph)*t.sw:0;return{x:t.x+dx,y:t.y,dx}}
// ---- apple shot
function spawnFruit(){
  const r=S.run,def=T.fruits[Math.min(r.idx,T.fruits.length-1)];
  r.fruit={def,R:def.R,born:S.t,gone:false};r.state='ready';
  r.fig.nerv=r.idx>=T.appleSwayFrom;
}
function appleAmp(){const i=S.run.idx;return i>=T.appleSwayFrom?Math.min(T.appleSwayMax,T.appleSway+(i-T.appleSwayFrom)*T.appleSwayStep):0}
function fruitPos(){const r=S.run;return toWorld(r.fig,0,-117-r.fruit.R*0.75)}
// ---- pots
function buildBoard(){
  const r=S.run,L=r.lvl,R=Math.max(T.pot.minR,T.pot.R*Math.pow(T.pot.shrink,L)),c=Math.max(T.pot.closeMin,1-T.pot.close*L);
  const base=[[-46,-112],[46,-112],[-92,-96],[92,-96],[-48,-24],[48,-24]];
  r.fig=mkFig('board',BX,GY+2);r.pf=IDENT;r.stuck=[];
  r.pots=base.map(b=>({lx:BX+b[0]*c,ly:GY+2-60+(b[1]+60)*c,R,kind:r.rng()<0.5?'pot':'skin',alive:true,born:S.t}));
  r.state='ready';
}
function buildWheel(){
  const r=S.run,L=r.lvl,W0=T.wheel,R=Math.max(W0.minR,W0.potR*Math.pow(W0.shrink,L));
  const dir=L>=1?(L%2?-1:1):1,w=W0.speed+W0.step*Math.min(L,8),th=r.wheel?r.wheel.th:0;
  r.wheel={th,w,dir};
  r.fig=mkFig('wheel',WX,WY);r.fig.rot=th;r.pf=r.fig;r.stuck=[];
  r.pots=[36,108,180,252,324].map(a=>{const q=a*Math.PI/180;return{lx:Math.sin(q)*74,ly:-Math.cos(q)*74,R,kind:r.rng()<0.5?'pot':'skin',alive:true,born:S.t}});
  r.state='ready';
}
function potPos(p){return toWorld(S.run.pf,p.lx,p.ly)}
function onSurface(x,y){
  if(S.mode==='board')return x>=BX-105&&x<=BX+105&&y>=GY-212&&y<=GY;
  return Math.hypot(x-WX,y-WY)<=T.wheel.R+4;
}
function classify(x,y){
  const r=S.run;
  if(S.mode==='targets'){const t=r.target,tp=tpos(t);return Math.hypot(x-tp.x,y-tp.y)<=t.R?{k:'target'}:null}
  if(S.mode==='apple'){
    if(r.fruit&&!r.fruit.gone){const fp=fruitPos();if(Math.hypot(x-fp.x,y-fp.y)<=r.fruit.R+1)return{k:'fruit'}}
    return figHit(r.fig,x,y)?{k:'man'}:null;
  }
  for(const p of r.pots){if(!p.alive)continue;const q=potPos(p);if(Math.hypot(x-q.x,y-q.y)<=p.R+2)return{k:'pot',p}}
  if(figHit(r.fig,x,y))return{k:'man'};
  return onSurface(x,y)?{k:'surface'}:null;
}
// ---- fx
function say(txt,x,y,col,size){S.fx.push({k:'txt',txt,x,y,col:col||'#fff',size:size||22,t:0,life:0.9})}
function puff(x,y){for(let i=0;i<12;i++){const a=Math.random()*6.28,s=30+Math.random()*90;S.fx.push({k:'p',x,y,vx:Math.cos(a)*s-30,vy:Math.sin(a)*s-30,t:0,life:0.5+Math.random()*0.3,c:Math.random()<.5?'#e9c970':'#c9a24a',r:1.5+Math.random()*2})}}
function splash(x,y,cols,n,R){
  S.fx.push({k:'splat',x,y,c:cols[0],r:R*1.7,t:0,life:0.6,bl:Array.from({length:8},(_,i)=>({a:i*0.785+Math.random()*0.5,d:0.5+Math.random()*0.6,s:0.16+Math.random()*0.2,c:cols[i%cols.length]}))});
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*190;S.fx.push({k:'d',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,t:0,life:0.5+Math.random()*0.5,c:cols[(Math.random()*cols.length)|0],r:2+Math.random()*3.5*Math.max(0.6,R/15)})}
}
function shards(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*150;S.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,t:0,life:0.7,c:Math.random()<.5?'#b8683a':'#8a4a24',r:2+Math.random()*2.5})}}
// ---- input
let ptr=null;
function inBtn(b,x,y){return x>=b.x-4&&x<=b.x+b.w+4&&y>=b.y-4&&y<=b.y+b.h+4}
function setMode(m){if(S.mode===m)return;S.mode=m;S.raised=false;S.thumb=null;ptr=null;newRun();}
function setWeapon(w){S.weapon=w;S.raised=false;S.thumb=null;ptr=null;newRun();}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  const x=e.clientX,y=e.clientY;
  for(const tb of BTN.tabs)if(inBtn(tb,x,y)){setMode(tb.id);return}
  if(S.run.state==='over'){if(inBtn(BTN.retry,x,y))newRun();return}
  const w=weapon();
  if(S.mode==='targets'){
    if(inBtn(BTN.bow,x,y)){if(S.weapon!=='bow')setWeapon('bow');return}
    if(inBtn(BTN.knife,x,y)){if(S.weapon!=='knife')setWeapon('knife');else{S.raised=!S.raised;if(S.raised)SFX.tick()}return}
  }else if(w==='knife'&&inBtn(BTN.knife,x,y)){S.raised=!S.raised;if(S.raised)SFX.tick();return}
  if(ptr!==null)return;
  if(S.run.state!=='ready'||S.proj.some(p=>!p.done))return;
  if(w==='knife'&&!S.raised){S.hint={txt:'TAP THE KNIFE TO RAISE IT',t:1.4};return}
  ptr={id:e.pointerId,sx:x,sy:y,x,y,drawT:0,maxd:0};S.thumb=ptr;
  if(w==='bow')SFX.creak();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
},{passive:false});
cv.addEventListener('pointermove',e=>{if(ptr&&e.pointerId===ptr.id){e.preventDefault();ptr.x=e.clientX;ptr.y=e.clientY;ptr.maxd=Math.max(ptr.maxd,Math.hypot(ptr.x-ptr.sx,ptr.y-ptr.sy));}},{passive:false});
function up(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  const p=ptr;ptr=null;S.thumb=null;
  const ax=p.x,ay=p.y-T.lift;
  if(weapon()==='knife'){
    if(p.maxd<T.drag){S.hint={txt:'DRAG, THEN LET GO',t:1.4};return}
    launch('knife',ax,ay);
  }else{
    if(p.drawT<T.drawT){say('TOO SOON',ax,ay-22,'#ffb070',24);SFX.soon();return}
    launch('arrow',ax,ay);
  }
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(ptr&&e.pointerId===ptr.id){ptr=null;S.thumb=null}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// ---- projectiles
function arcH(ax){return T.arc*Math.max(0,Math.min(1,(ax-HAND.x-W*0.3)/(W*0.45)))}
function launch(kind,ax,ay){
  const dur=kind==='knife'?T.knifeT:T.arrowT;
  S.proj.push({kind,x0:HAND.x+34,y0:HAND.y-6,ax,ay,dur,t:0,done:false,x:HAND.x+34,y:HAND.y-6,vx:0,vy:0,rot:0,free:false,arc:kind==='knife'?arcH(ax):0});
  S.run.state='flying';
  if(kind==='knife')SFX.whoosh();else SFX.twang();
}
function bumpBest(){const r=S.run,b=loadBest();if(r.score>b){saveBest(r.score);r.newBest=true}}
function missFree(p){p.free=true;p.vx=(p.ax-p.x0)/p.dur;p.vy=(p.ay-p.y0)/p.dur}
function addMiss(x,y){
  const r=S.run;r.misses++;SFX.miss();say('MISS',x,y-16,'#ff8a70',22);
  if(r.misses>=T.misses){r.state='ending';r.timer=0.9;r.why='misses'}else{r.state='missed';r.timer=0.35}
}
function hurtMan(p){
  const r=S.run,f=r.fig,P=poseParts(f.type),hp=toWorld(f,P.head[0],P.head[1]);
  f.hurt=true;f.hurtT=0;r.state='hurt';r.timer=1.6;r.why='ow';
  if(S.mode==='apple'&&r.fruit&&!r.fruit.gone){const fp=fruitPos();r.loose.push({x:fp.x,y:fp.y,vx:-40,vy:-120,R:r.fruit.R,def:r.fruit.def});r.fruit.gone=true}
  say('OW!',hp.x-10,hp.y-44,'#ffd34a',46);SFX.ow();
  p.free=true;p.vx=-70;p.vy=-160;p.ax=p.x;p.ay=p.y;
}
function resolve(p){
  const r=S.run,c=classify(p.ax,p.ay);
  if(S.mode==='targets'){
    if(c){
      const t=r.target,tp=tpos(t),d=Math.hypot(p.ax-tp.x,p.ay-tp.y),q=d/t.R,sc=q<0.2?10:q<0.55?5:2;
      p.done=true;
      r.stuck.push({kind:p.kind,rx:p.ax-t.x,ry:p.ay-t.y,ang:Math.atan2(p.ay-p.y0,p.ax-p.x0)});
      SFX.thunk();puff(p.ax,p.ay);
      say(String(sc),p.ax,p.ay-12,sc===10?'#ffd34a':sc===5?'#fff':'#e0d6c0',sc===10?34:28);
      r.score++;
      if(sc===10&&r.misses>0){r.misses--;say('MISS BACK',tp.x,tp.y-t.R-18,'#7be07b',20);SFX.ding()}
      bumpBest();r.state='between';r.timer=0.55;r.after=()=>{r.idx++;spawnTarget()};
    }else{missFree(p);addMiss(p.ax,p.ay)}
    return;
  }
  if(c&&c.k==='man'){hurtMan(p);return}
  if(c&&c.k==='fruit'){
    const fp=fruitPos(),d=r.fruit.def;p.done=true;
    splash(fp.x,fp.y,d.j,26,r.fruit.R);SFX.splat();say('SPLAT!',fp.x-20,fp.y-r.fruit.R-14,'#fff',24);
    r.fruit.gone=true;r.score++;bumpBest();r.state='between';r.timer=0.7;
    r.after=()=>{r.idx++;spawnFruit()};
    return;
  }
  if(c&&c.k==='pot'){
    const q=potPos(c.p);p.done=true;c.p.alive=false;
    splash(q.x,q.y,['#b3192b','#d12a3c','#8c1020'],22,c.p.R);shards(q.x,q.y,9);SFX.crack();SFX.splat();
    r.score++;bumpBest();
    if(!r.pots.some(x=>x.alive)){
      r.state='between';r.timer=1.0;
      if(S.mode==='board'){say('NEW BOARD',BX,GY-230,'#ffe08a',26);r.after=()=>{r.lvl++;buildBoard()}}
      else{const nl=r.lvl+1;say(nl%2?'FASTER, REVERSE!':'FASTER!',WX,WY-T.wheel.R-12,'#ffe08a',24);r.after=()=>{r.lvl=nl;buildWheel()}}
    }else{r.state='between';r.timer=0.3;r.after=null}
    return;
  }
  if(c&&c.k==='surface'){
    p.done=true;const l=toLocal(r.pf,p.ax,p.ay);
    r.stuck.push({kind:p.kind,lx:l.x,ly:l.y,ang:Math.atan2(p.ay-p.y0,p.ax-p.x0)-r.pf.rot});
    if(r.stuck.length>14)r.stuck.shift();
    SFX.thunk();puff(p.ax,p.ay);addMiss(p.ax,p.ay);return;
  }
  missFree(p);addMiss(p.ax,p.ay);
}
function update(dt){
  S.t+=dt;if(S.hint.t>0)S.hint.t-=dt;S.shake=Math.max(0,S.shake-dt*3);
  const r=S.run,w=weapon();
  if(ptr&&w==='bow'){ptr.drawT=Math.min(T.drawT,ptr.drawT+dt);if(ptr.drawT>=T.drawT&&!ptr.full){ptr.full=true;SFX.tick()}}
  if(ptr&&w==='knife'){const c=classify(ptr.x,ptr.y-T.lift),on=!!c&&(c.k==='target'||c.k==='pot');if(on!==ptr.on){ptr.on=on;if(on)SFX.tick()}}
  updScene(dt);
  for(const p of S.proj){
    if(p.done)continue;
    if(!p.free){
      p.t+=dt;const k=Math.min(1,p.t/p.dur);
      p.x=p.x0+(p.ax-p.x0)*k;p.y=p.y0+(p.ay-p.y0)*k-4*p.arc*k*(1-k);p.rot+=dt*(p.kind==='knife'?26:0);
      if(k>=1)resolve(p);
    }else{
      p.vy+=(p.kind==='knife'?1100:500)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*(p.kind==='knife'?20:0);
      if(p.y>=GY+4||p.x>W+60){p.done=true;if(p.y>=GY){S.fx.push({k:'stuckg',x:p.x,y:GY+2,kind:p.kind,ang:Math.atan2(p.vy,p.vx),t:0,life:1.2});puff(p.x,GY)}}
    }
  }
  S.proj=S.proj.filter(p=>!p.done);
  if(r.state==='hurt'){r.timer-=dt;if(r.timer<=0){r.state='over';bumpBest();SFX.end()}}
  else if(r.state==='missed'||r.state==='between'||r.state==='ending'){
    if(!S.proj.length||r.state==='between'){r.timer-=dt;
      if(r.timer<=0){
        if(r.state==='missed')r.state='ready';
        else if(r.state==='between'){const a=r.after;r.after=null;r.state='ready';if(a)a()}
        else{r.state='over';SFX.end()}
      }}
  }
  for(const f of S.fx){f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=200*dt}else if(f.k==='d'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=620*dt;f.vx*=0.99}}
  S.fx=S.fx.filter(f=>f.t<f.life);
}
function updScene(dt){
  const r=S.run,f=r.fig;
  if(S.mode==='wheel'){
    if(f.hurt)r.wheel.w*=Math.exp(-2.5*dt);
    r.wheel.th+=r.wheel.w*r.wheel.dir*dt;f.rot=r.wheel.th;
    if(f.hurt)f.hurtT+=dt;
    return;
  }
  if(S.mode==='apple'||S.mode==='board'){
    if(f.hurt){
      f.type='sit';f.hurtT+=dt;const t=f.hurtT;
      if(t<0.18){f.oy=f.by-30*(1-t/0.18)}
      else{f.oy=f.by;f.rot=Math.sin(t*26)*0.05*Math.exp(-(t-0.18)*6);
        if(!f.landed){f.landed=true;SFX.thud();S.shake=0.35;puff(f.ox,GY+2);puff(f.ox-20,GY+2)}}
    }else if(S.mode==='apple'){
      const a=appleAmp(),tt=S.t;
      f.ox=FARX+(Math.sin(tt*1.9+f.ph)+Math.sin(tt*3.3)*0.3)*a;f.rot=Math.sin(tt*1.9+f.ph)*a*0.003;
    }
  }
  for(const l of r.loose){l.vy+=900*dt;l.x+=l.vx*dt;l.y+=l.vy*dt;const gy=GY+4-l.R;if(l.y>gy){l.y=gy;l.vy*=-0.35;l.vx*=0.85;if(Math.abs(l.vy)<30)l.vy=0}}
}

  const r=S.run,f=r.fig;
  drawFig(f);
  if(r.fruit&&!r.fruit.gone){
    const k=Math.min(1,(S.t-r.fruit.born)/0.3),fp=fruitPos();
    drawFruitShape(fp.x,fp.y-34*Math.pow(1-k,2),r.fruit.R,r.fruit.def.k,0.5+0.5*k);
  }
  for(const l of r.loose)drawFruitShape(l.x,l.y,l.R,l.def.k,1);
}
function drawBoard(){
  const r=S.run;
  const x=BX-105,y=GY-212,w=210,h=210;
  g.fillStyle='rgba(60,40,20,.25)';g.fillRect(x+6,GY-2,w,6);
  g.fillStyle='#a9783f';g.fillRect(x,y,w,h);
  g.strokeStyle='#7a5226';g.lineWidth=2;for(let i=1;i<6;i++){g.beginPath();g.moveTo(x+i*35,y);g.lineTo(x+i*35,y+h);g.stroke()}
  g.strokeStyle='rgba(90,55,20,.35)';g.lineWidth=1;for(let i=0;i<14;i++){const gx=x+((i*53)%200)+5,gy=y+((i*37)%190)+8;g.beginPath();g.moveTo(gx,gy);g.lineTo(gx+3,gy+16);g.stroke()}
  g.strokeStyle='#5a3b22';g.lineWidth=7;g.strokeRect(x+3,y+3,w-6,h-6);
  g.fillStyle='#2a1a0c';for(const[nx,ny]of[[x+10,y+10],[x+w-10,y+10],[x+10,y+h-10],[x+w-10,y+h-10]]){g.beginPath();g.arc(nx,ny,2.5,0,6.28);g.fill()}
  drawStuck();
  drawFig(r.fig);
  for(const p of r.pots)if(p.alive)drawPot(p.lx,p.ly,p.R,p.kind,popSc(p.born),true);
}
function drawWheel(){
  const r=S.run,R=T.wheel.R,th=r.wheel.th;
  g.strokeStyle='#5a3b22';g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(WX,WY);g.lineTo(WX-52,GY+2);g.moveTo(WX,WY);g.lineTo(WX+52,GY+2);g.stroke();
  g.lineWidth=7;g.beginPath();g.moveTo(WX-62,GY+2);g.lineTo(WX+62,GY+2);g.stroke();
  g.save();g.translate(WX,WY);g.rotate(th);
  g.fillStyle='#b98a4e';g.beginPath();g.arc(0,0,R,0,6.28);g.fill();
  g.strokeStyle='#8a5e2c';g.lineWidth=2;for(let i=0;i<8;i++){const a=i*Math.PI/8;g.beginPath();g.moveTo(Math.cos(a)*R,Math.sin(a)*R);g.lineTo(-Math.cos(a)*R,-Math.sin(a)*R);g.stroke()}
  g.strokeStyle='#6e4a22';g.lineWidth=10;g.beginPath();g.arc(0,0,R-3,0,6.28);g.stroke();
  g.fillStyle='#2a1a0c';for(let i=0;i<12;i++){const a=i*Math.PI/6;g.beginPath();g.arc(Math.cos(a)*(R-3),Math.sin(a)*(R-3),2.2,0,6.28);g.fill()}
  g.restore();
  g.save();g.translate(WX,WY);g.rotate(th);g.translate(-WX,-WY);
  for(const s of r.stuck)drawMissile(WX+s.lx,WY+s.ly,s.ang,s.kind,true);
  g.restore();
  drawFig(r.fig);
  g.save();g.translate(WX,WY);g.rotate(th);
  for(const p of r.pots)if(p.alive){g.save();g.translate(p.lx,p.ly);g.fillStyle='#4a2d1a';g.beginPath();g.arc(0,0,p.R+3,0,6.28);g.fill();g.restore();drawPot(p.lx,p.ly,p.R,p.kind,popSc(p.born),false)}
  g.fillStyle='#3a2210';g.beginPath();g.arc(0,0,5,0,6.28);g.fill();
  g.restore();
}
function drawMissile(x,y,ang,kind,stuck){
  g.save();g.translate(x,y);g.rotate(ang);
  if(kind==='knife'){
    if(stuck){g.fillStyle='#5a3b22';g.fillRect(-20,-3,17,6);g.fillStyle='#cfd3d9';g.fillRect(-4,-2,8,4)}
    else{g.fillStyle='#5a3b22';g.fillRect(-14,-3,12,6);g.fillStyle='#e4e8ee';g.beginPath();g.moveTo(-2,-4);g.lineTo(16,0);g.lineTo(-2,4);g.fill()}
  }else{
    g.strokeStyle='#8a5a2a';g.lineWidth=3;g.beginPath();g.moveTo(stuck?-36:-30,0);g.lineTo(stuck?0:12,0);g.stroke();
    g.fillStyle='#cfd3d9';if(!stuck){g.beginPath();g.moveTo(12,-4);g.lineTo(21,0);g.lineTo(12,4);g.fill()}
    g.fillStyle='#b9372a';g.fillRect(stuck?-36:-30,-4,8,2);g.fillRect(stuck?-36:-30,2,8,2);
  }
  g.restore();
}
function drawProj(){
  for(const p of S.proj){
    g.strokeStyle=p.kind==='knife'?'rgba(255,255,255,.35)':'rgba(255,255,255,.3)';g.lineWidth=p.kind==='knife'?2:1.5;g.beginPath();g.moveTo(p.x0,p.y0);
    if(!p.free&&p.arc){const k=Math.min(1,p.t/p.dur);for(let i=1;i<=10;i++){const kk=k*i/10;g.lineTo(p.x0+(p.ax-p.x0)*kk,p.y0+(p.ay-p.y0)*kk-4*p.arc*kk*(1-kk))}}
    else g.lineTo(p.x,p.y);
    g.stroke();
    if(p.kind==='knife')drawMissile(p.x,p.y,p.rot,'knife',false);
    else drawMissile(p.x,p.y,Math.atan2(p.free?p.vy:p.ay-p.y0,p.free?p.vx:p.ax-p.x0),'arrow',false);
  }
  for(const f of S.fx)if(f.k==='stuckg'){g.globalAlpha=1-f.t/f.life;drawMissile(f.x,f.y,f.kind==='knife'?1.2:Math.max(-1.3,Math.min(1.3,f.ang)),f.kind,true);g.globalAlpha=1}
}
function drawAim(){
  if(!ptr)return;
  const x=ptr.x,y=ptr.y-T.lift,c=classify(x,y),k=c?c.k:'',w=weapon();
  const good=k==='target'||k==='fruit'||k==='pot',bad=k==='man';
  const col0=good?'#43e06a':bad?'#ff4a3a':'#f0b429';
  g.save();
  g.fillStyle='rgba(255,255,255,.18)';g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.beginPath();g.arc(ptr.x,ptr.y,22,0,6.28);g.fill();g.stroke();
  let col=col0,r=17,dr=0;
  if(w==='bow'){dr=ptr.drawT/T.drawT;r=46-dr*34;if(dr>=1){r=11;col=(good||bad)?col0:'#ffe08a'}}
  g.strokeStyle=good?'rgba(67,224,106,.8)':bad?'rgba(255,74,58,.85)':'rgba(240,180,41,.7)';g.lineWidth=2;g.beginPath();g.moveTo(x,y+r);g.lineTo(ptr.x,ptr.y-22);g.stroke();
  g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.arc(x,y,r,0,6.28);g.stroke();
  g.lineWidth=2;g.beginPath();g.moveTo(x-r-6,y);g.lineTo(x-r+5,y);g.moveTo(x+r-5,y);g.lineTo(x+r+6,y);g.moveTo(x,y-r-6);g.lineTo(x,y-r+5);g.moveTo(x,y+r-5);g.lineTo(x,y+r+6);g.stroke();
  g.fillStyle=col;g.beginPath();g.arc(x,y,2.5,0,6.28);g.fill();
  if(w==='bow'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-24,y-r-16,48,6);g.fillStyle=dr>=1?'#43e06a':'#f0b429';g.fillRect(x-24,y-r-16,48*dr,6)}
  g.restore();
}
function txt(s,x,y,size,col,align,stroke){g.font='700 '+size+'px system-ui,Segoe UI,Roboto,sans-serif';g.textAlign=align||'left';g.textBaseline='middle';
  if(stroke!==false){g.lineWidth=Math.max(3,size/5);g.strokeStyle='rgba(40,22,8,.85)';g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function drawFx(){
  for(const f of S.fx){
    if(f.k==='txt'){const k=f.t/f.life;g.globalAlpha=k<0.7?1:1-(k-0.7)/0.3;const sc=k<0.15?0.6+k/0.15*0.5:1.1;txt(f.txt,f.x,f.y-k*26,f.size*sc,f.col,'center');g.globalAlpha=1}
    else if(f.k==='p'){g.globalAlpha=1-f.t/f.life;g.fillStyle=f.c;g.fillRect(f.x,f.y,f.r*2,f.r*2);g.globalAlpha=1}
    else if(f.k==='d'){g.globalAlpha=Math.min(1,2*(1-f.t/f.life));g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r,0,6.28);g.fill();g.globalAlpha=1}
    else if(f.k==='splat'){
      const k=f.t/f.life,e=1-Math.pow(1-Math.min(1,k*3),3);g.globalAlpha=k<0.5?0.95:Math.max(0,0.95*(1-(k-0.5)*2));
      g.fillStyle=f.c;g.beginPath();g.arc(f.x,f.y,f.r*0.35*e,0,6.28);g.fill();
      for(const b of f.bl){g.fillStyle=b.c;g.beginPath();g.arc(f.x+Math.cos(b.a)*f.r*b.d*e,f.y+Math.sin(b.a)*f.r*b.d*e,f.r*b.s*(0.6+e*0.5),0,6.28);g.fill()}
      g.globalAlpha=1;
    }
  }
}
function btn(b,label,active,sub,size){
  g.save();rr(b.x,b.y,b.w,b.h,10);g.fillStyle=active?'#f0b429':'rgba(60,38,18,.82)';g.fill();g.lineWidth=2;g.strokeStyle=active?'#fff3c4':'rgba(240,210,150,.6)';g.stroke();
  txt(label,b.x+b.w/2,b.y+b.h/2+(sub?-5:0),size||16,active?'#3a2210':'#f6e7c4','center',false);
  if(sub)txt(sub,b.x+b.w/2,b.y+b.h/2+10,10,active?'#6a4a20':'#c9b58a','center',false);
  g.restore();
}
function hintText(){
  const w=weapon();
  if(S.mode==='apple')return'HOLD TO DRAW, AIM AT THE FRUIT, NOT THE MAN';
  if(S.mode==='board')return S.raised?'DRAG, LET GO: BURST THE POTS, MISS THE MAN':'TAP THE KNIFE, THEN BURST THE POTS';
  if(S.mode==='wheel')return S.raised?'LEAD THE SPIN. DO NOT HIT HIM':'TAP THE KNIFE, THEN LEAD THE SPIN';
  return w==='knife'?(S.raised?'PUT YOUR THUMB DOWN, DRAG, LET GO':'TAP THE KNIFE, THEN DRAG AND LET GO'):'HOLD TO DRAW, DRAG TO AIM, LET GO';
}
function drawHud(){
  const r=S.run,mi=modeInfo();
  for(const tb of BTN.tabs){const m=MODES.find(x=>x.id===tb.id);btn(tb,m.label,S.mode===tb.id,null,15)}
  const y0=50;
  g.fillStyle='rgba(50,30,14,.55)';rr(10,y0,150,40,10);g.fill();
  txt(mi.sc,20,y0+12,11,'#e8d3a0','left',false);txt(String(r.score),20,y0+29,22,'#fff','left',false);
  const cx=W/2;g.fillStyle='rgba(50,30,14,.55)';rr(cx-52,y0,104,30,15);g.fill();
  for(let i=0;i<T.misses;i++){const px=cx-26+i*26;g.beginPath();g.arc(px,y0+15,9,0,6.28);
    if(i<T.misses-r.misses){g.fillStyle='#e8b82a';g.fill();g.strokeStyle='#fff3c4'}else{g.fillStyle='rgba(0,0,0,.35)';g.fill();g.strokeStyle='#c05a48'}
    g.lineWidth=2;g.stroke();if(i>=T.misses-r.misses){g.beginPath();g.moveTo(px-4,y0+11);g.lineTo(px+4,y0+19);g.moveTo(px+4,y0+11);g.lineTo(px-4,y0+19);g.stroke()}}
  let sub='';
  if(S.mode==='apple'&&r.fruit)sub=r.fruit.def.n;
  else if(S.mode==='board')sub='BOARD '+(r.lvl+1);
  else if(S.mode==='wheel')sub='WHEEL '+(r.lvl+1)+'  '+(r.wheel.dir>0?'CW':'CCW');
  if(sub){g.font='700 12px system-ui,sans-serif';const tw=g.measureText(sub).width+20;g.fillStyle='rgba(50,30,14,.55)';rr(cx-tw/2,y0+34,tw,20,10);g.fill();txt(sub,cx,y0+44,12,'#ffe9b0','center',false)}
  g.fillStyle='rgba(50,30,14,.55)';rr(W-160,y0,150,40,10);g.fill();
  txt('BEST '+(S.mode==='targets'?S.weapon.toUpperCase():''),W-20,y0+12,11,'#e8d3a0','right',false);txt(String(loadBest()),W-20,y0+29,22,'#fff','right',false);
  const w=weapon();
  if(S.mode==='targets'){btn(BTN.knife,'KNIFE',w==='knife',w==='knife'?(S.raised?'raised':'tap to raise'):null);btn(BTN.bow,'BOW',w==='bow',null)}
  else if(w==='knife')btn(BTN.knife,'KNIFE',true,S.raised?'raised':'tap to raise');
  else btn(BTN.bow,'BOW',true,null);
  if(S.hint.t>0){g.globalAlpha=Math.min(1,S.hint.t);txt(S.hint.txt,W/2,H-24,18,'#fff','center');g.globalAlpha=1}
  else if(!S.proj.length&&!ptr&&r.state==='ready'&&r.score===0&&r.misses===0){txt(hintText(),W/2,H-24,15,'#fff','center')}
}
function drawEnd(){
  const r=S.run,mi=modeInfo();g.fillStyle='rgba(30,16,6,.6)';g.fillRect(0,0,W,H);
  const w=300,h=222,x=W/2-w/2,y=H/2-h/2+14;
  rr(x,y,w,h,16);g.fillStyle='#f1dcaa';g.fill();g.lineWidth=4;g.strokeStyle='#8a5a2a';g.stroke();
  txt(r.why==='ow'?'OW! YOU HIT HIM':'RUN OVER',W/2,y+26,22,'#7b2f22','center',false);
  txt(String(r.score),W/2,y+66,44,'#3a2210','center',false);
  txt(r.score===1?mi.unit.replace('targets','target').replace('fruits','fruit').replace('pots','pot'):mi.unit,W/2,y+96,13,'#6a4a20','center',false);
  txt(r.newBest?'NEW BEST!':'Best  '+loadBest()+'  ('+mi.label.toLowerCase()+(S.mode==='targets'?', '+S.weapon:'')+')',W/2,y+124,r.newBest?18:15,r.newBest?'#b8641a':'#3a2210','center',false);
  const b=BTN.retry;b.y=y+h-64;rr(b.x,b.y,b.w,b.h,12);g.fillStyle='#d9892a';g.fill();g.lineWidth=2;g.strokeStyle='#fff3c4';g.stroke();
  txt('RETRY',b.x+b.w/2,b.y+b.h/2,20,'#fff','center',true);
}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
  g.save();if(S.shake>0)g.translate((Math.random()-0.5)*S.shake*10,(Math.random()-0.5)*S.shake*10);
  drawBg();drawFighter();
  if(S.mode==='targets')drawTarget();else if(S.mode==='apple')drawApple();else if(S.mode==='board')drawBoard();else drawWheel();
  drawProj();drawFx();
  g.restore();
  drawAim();drawHud();
  if(S.run.state==='over')drawEnd();
}
// ---- loop
let last=0;
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;update(dt);render();requestAnimationFrame(frame)}
addEventListener('resize',resize);
resize();newRun();
window.__S=S;window.__T=T;window.__loadBest=loadBest;
window.__probe=()=>{const r=S.run,o={mode:S.mode,state:r.state,fig:null,fruit:null,pots:[],target:null};
  if(r.fig){const P=poseParts(r.fig.type);const h=toWorld(r.fig,P.head[0],P.head[1]);o.fig={head:h,chest:toWorld(r.fig,0,P.sh[1]+14)}}
  if(S.mode==='apple'&&r.fruit&&!r.fruit.gone)o.fruit=Object.assign(fruitPos(),{R:r.fruit.R});
  if(S.mode==='targets'&&r.target){const tp=tpos(r.target);o.target={x:tp.x,y:tp.y,R:r.target.R}}
  for(const p of r.pots)if(p.alive){const q=potPos(p);o.pots.push({x:q.x,y:q.y,R:p.R})}
  return o};
requestAnimationFrame(frame);
})();
</script></body></html>
