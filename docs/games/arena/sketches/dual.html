<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Two Weapons Sketch</title>
<style>
html,body{margin:0;height:100%;background:#2b1d12;overflow:hidden}
canvas{display:block;width:100vw;height:calc(100vw*375/667);max-height:calc(100vh - 52px)}
#tabs{display:flex;gap:6px;padding:4px 10px}
#tabs button{flex:1;height:44px;font:700 15px system-ui,sans-serif;color:#f3e3c3;background:#5a3b22;border:2px solid #8a5d36;border-radius:8px}
#tabs button.on{background:#c0662a;border-color:#ffd27a}
</style></head><body>
<canvas id="c" width="667" height="375"></canvas>
<div id="tabs"></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
const bg=new Image();bg.src='../../../../games/arena/assets/arena-pit.webp';
const FRAMES=54,FPS=18,FLOOR=326,BX0=200,SURF=420,FOEX=SURF+20;
const MODES={
 a:{label:'A  BOTH TOGETHER',cap:'Two hits every blow. No shield.',w:'spear'},
 b:{label:'B  LEFT, RIGHT',cap:'Faster blows, hand to hand. No shield.',w:'spear'},
 today:{label:'TODAY',cap:'Main hand strikes, off hand flicks in late.',w:'spear'},
 swords:{label:'A  BOTH TOGETHER (SWORDS)',cap:'Two hits every blow. No shield.',w:'sword'}
};
const sm=t=>t*t*(3-2*t);
function kf(n,keys){ // keys: [[frame,{x,y,a}],...]
  if(n<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){const[f1,p1]=keys[i],[f0,p0]=keys[i-1];
    if(n<=f1){const u=sm((n-f0)/(f1-f0));return{x:p0.x+(p1.x-p0.x)*u,y:p0.y+(p1.y-p0.y)*u,a:p0.a+(p1.a-p0.a)*u}}}
  return keys[keys.length-1][1];}
function kn(n,keys){ // scalar keys
  if(n<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){const[f1,v1]=keys[i],[f0,v0]=keys[i-1];if(n<=f1)return v0+(v1-v0)*sm((n-f0)/(f1-f0))}
  return keys[keys.length-1][1];}
const GM={x:52,y:200,a:-0.1},GO={x:48,y:236,a:0.02},HG={x:10,y:262,a:1.0};
const TJ=8;
function build(mode){
  const M=MODES[mode],L=M.w==='spear'?140:64,tipOff=0.68*L; // tip reach beyond hand
  const TS=mode==='b'?24:30;
  const JX=80,SX=60,SXo=60;
  const J=SURF-(BX0+JX)-tipOff, S=SURF-(BX0+SX)-tipOff*Math.cos(0.2);
  const jabKeys=(g0,y)=>[[TJ,g0],[TJ+4,{x:JX,y,a:g0.a}],[TJ+6,{x:JX,y,a:g0.a}],[TJ+12,g0]];
  const slKeys=(g0,dy,t0)=>[[t0,g0],[t0+5,{x:50,y:184+dy,a:-1.35}],[t0+8,{x:SX,y:194+dy,a:0.2}],[t0+10,{x:SX+4,y:200+dy,a:0.6}],[t0+17,g0]];
  let main,off,body,hits=[];
  body=[[0,0]];
  if(mode==='a'||mode==='swords'){
    main=[...jabKeys(GM,200).slice(0,-1),[TJ+12,GM],...slKeys(GM,0,TS).slice(1)];
    off=[...jabKeys(GO,236).slice(0,-1),[TJ+12,GO],...slKeys(GO,36,TS).slice(1)];
    body=[[TJ,0],[TJ+4,J],[TJ+6,J],[TJ+12,0],[TS,0],[TS+5,S*0.3],[TS+8,S],[TS+10,S],[TS+17,0]];
    hits=[{w:'m',f:TJ+4,t:'jab'},{w:'o',f:TJ+4,t:'jab'},{w:'m',f:TS+8,t:'cut'},{w:'o',f:TS+8,t:'cut'}];
  }else if(mode==='b'){
    main=[...jabKeys(GM,200).slice(0,-1),[TJ+12,GM],[TS+17,GM]];
    off=[[0,GO],...slKeys(GO,36,TS)];
    body=[[TJ,0],[TJ+4,J],[TJ+6,J],[TJ+12,0],[TS,0],[TS+5,S*0.3],[TS+8,S],[TS+10,S],[TS+17,0]];
    hits=[{w:'m',f:TJ+4,t:'jab'},{w:'o',f:TS+8,t:'cut'}];
  }else{ // today
    main=[...jabKeys(GM,200).slice(0,-1),[TJ+12,GM],...slKeys(GM,0,TS).slice(1)];
    off=[[0,HG],[TJ+2,HG],[TJ+6.5,{x:78,y:240,a:-0.05}],[TJ+8,{x:78,y:240,a:-0.05}],[TJ+14,HG],
         [TS+2,HG],[TS+7,{x:30,y:236,a:-0.5}],[TS+10.5,{x:SXo,y:226,a:0.2}],[TS+12,{x:SXo+4,y:230,a:0.5}],[TS+19,HG]];
    body=[[TJ,0],[TJ+4,J],[TJ+8,J],[TJ+14,0],[TS,0],[TS+5,S*0.3],[TS+8,S],[TS+12,S],[TS+19,0]];
    hits=[{w:'m',f:TJ+4,t:'jab'},{w:'o',f:TJ+6.5,t:'jab',small:1},{w:'m',f:TS+8,t:'cut'},{w:'o',f:TS+10.5,t:'cut',small:1}];
  }
  return{L,main,off,body,hits,TS,sword:M.w==='sword'};
}
const B={};for(const k in MODES)B[k]=build(k);
function ik(sx,sy,hx,hy,l1,l2){let dx=hx-sx,dy=hy-sy,d=Math.hypot(dx,dy);d=Math.min(d,l1+l2-0.5);
  const ang=Math.atan2(dy,dx),c=(l1*l1+d*d-l2*l2)/(2*l1*d),a=Math.acos(Math.max(-1,Math.min(1,c)));
  const e=ang+a; // elbow below the line
  return[sx+Math.cos(e)*l1,sy+Math.sin(e)*l1,sx+Math.cos(ang)*d,sy+Math.sin(ang)*d];}
function limb(p,col,w){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(p[2],p[3]);g.lineTo(p[4],p[5]);g.stroke();}
function weapon(hx,hy,a,L,sword,dark){
  const dx=Math.cos(a),dy=Math.sin(a);
  g.save();g.translate(hx,hy);g.rotate(a);
  if(!sword){
    g.strokeStyle=dark?'#4a2f18':'#6b4423';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(-L*0.32,0);g.lineTo(L*0.55,0);g.stroke();
    g.fillStyle=dark?'#b9c3cc':'#e6edf2';g.strokeStyle='#4a5560';g.lineWidth=1.2;
    g.beginPath();g.moveTo(L*0.5,0);g.lineTo(L*0.58,-6);g.lineTo(L*0.68,0);g.lineTo(L*0.58,6);g.closePath();g.fill();g.stroke();
  }else{
    g.fillStyle='#6b4423';g.fillRect(-9,-2.5,12,5);
    g.fillStyle='#caa44a';g.fillRect(2,-8,4,16);
    g.fillStyle=dark?'#b9c3cc':'#e6edf2';g.strokeStyle='#4a5560';g.lineWidth=1.2;
    g.beginPath();g.moveTo(6,-4);g.lineTo(L*0.7,-4.5);g.lineTo(L,0);g.lineTo(L*0.7,4.5);g.lineTo(6,4);g.closePath();g.fill();g.stroke();
  }
  g.restore();
  const t=L*0.68*(sword?1/0.68:1);
  return{tx:hx+dx*(sword?L:L*0.68),ty:hy+dy*(sword?L:L*0.68)};
}
function burst(x,y,r,col){
  g.save();g.translate(x,y);g.fillStyle=col;g.strokeStyle='#5a2a0a';g.lineWidth=2;g.beginPath();
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2+0.2,rr=i%2?r*0.5:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  g.closePath();g.fill();g.stroke();g.restore();}
function swoosh(x,y,k){g.strokeStyle='rgba(255,255,255,'+(0.9*k)+')';g.lineWidth=3;g.lineCap='round';
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(x-30+i*6,y-26+i*2);g.lineTo(x+14+i*6,y+30+i*2);g.stroke();}}
function foe(rec){
  const x=FOEX+rec;g.save();
  g.strokeStyle='#a46a3c';g.lineWidth=9;g.lineCap='round';
  g.beginPath();g.moveTo(x-8,266);g.lineTo(x-14,FLOOR);g.moveTo(x+8,266);g.lineTo(x+16,FLOOR);g.stroke();
  g.fillStyle='#4a2f18';g.fillRect(x-24,FLOOR-3,20,5);g.fillRect(x+6,FLOOR-3,22,5);
  g.fillStyle='#e8e0d0';g.fillRect(x-20,250,40,24);
  g.fillStyle='#b88a4a';g.strokeStyle='#5c4020';g.lineWidth=2;g.beginPath();g.rect(x-20,192,40,64);g.fill();g.stroke();
  g.strokeStyle='#a46a3c';g.lineWidth=8;g.beginPath();g.moveTo(x-18,200);g.lineTo(x-26,236);g.moveTo(x+18,200);g.lineTo(x+22,238);g.stroke();
  g.fillStyle='#a46a3c';g.beginPath();g.arc(x,176,14,0,7);g.fill();
  g.fillStyle='#9aa3ab';g.strokeStyle='#4a5560';g.beginPath();g.rect(x-14,160,28,18);g.fill();g.stroke();
  g.restore();}
function fighter(bx,f,B_){
  const x=bx;
  const hip=[x,266],lf=[x+34,FLOOR],bf=[x-34,FLOOR];
  g.lineCap='round';
  // legs
  
  limb(ik(hip[0],hip[1],bf[0],bf[1],38,38),'#8c5a30',9);
  // off arm + weapon behind body
  const po=kf(f,B_.off),sho=[x+2,208];
  const wo=po;
  const wb=weaponDraw(x,po,B_,true);
  const mo=ik(sho[0],sho[1],x+po.x,po.y,44,44);limb(mo,'#8c5a30',7);
  // body
  g.fillStyle='#e8e0d0';g.beginPath();g.moveTo(x-14,252);g.lineTo(x+18,252);g.lineTo(x+26,276);g.lineTo(x-20,276);g.closePath();g.fill();
  g.fillStyle='#c4352c';g.strokeStyle='#6e1a14';g.lineWidth=2;g.beginPath();g.rect(x-14,194,34,60);g.fill();g.stroke();
  limb(ik(hip[0],hip[1],lf[0],lf[1],38,38),'#b9784a',9);
  g.fillStyle='#4a2f18';g.fillRect(lf[0]-6,FLOOR-3,24,5);g.fillRect(bf[0]-14,FLOOR-3,22,5);
  g.fillStyle='#b9784a';g.beginPath();g.arc(x+8,176,14,0,7);g.fill();
  g.fillStyle='#4a78b8';g.beginPath();g.arc(x+8,173,14,Math.PI,0);g.fill();
  // main arm + weapon
  const pm=kf(f,B_.main),sh=[x+4,204];
  weaponDraw(x,pm,B_,false);
  limb(ik(sh[0],sh[1],x+pm.x,pm.y,44,44),'#b9784a',7);
}
function weaponDraw(x,p,B_,dark){return weapon(x+p.x,p.y,p.a,B_.L,B_.sword,dark)}
let MODE='a',playN=0,t0=performance.now();
function draw(n){
  n=Math.max(0,Math.min(FRAMES-1,n));
  const B_=B[MODE],M=MODES[MODE];
  g.clearRect(0,0,667,375);
  if(bg.complete&&bg.naturalWidth)g.drawImage(bg,0,0,667,375);else{g.fillStyle='#d9a45a';g.fillRect(0,0,667,375);}
  g.fillStyle='rgba(30,15,5,0.28)';g.fillRect(0,0,667,375);
  // recoil
  let rec=0;for(const h of B_.hits){const d=n-h.f;if(d>=0&&d<8)rec+=(h.small?3:6)*(1-d/8)*Math.cos(d*1.2);}
  foe(rec);
  const bx=BX0+kn(n,B_.body);
  fighter(bx,n,B_);
  // hit marks
  for(const h of B_.hits){const d=n-h.f;if(d<-0.01||d>3.2)continue;
    const p=kf(h.f,h.w==='m'?B_.main:B_.off),bxh=BX0+kn(h.f,B_.body);
    const dx=Math.cos(p.a),dy=Math.sin(p.a),len=B_.sword?B_.L:B_.L*0.68;
    const tx=Math.min(bxh+p.x+dx*len,SURF+2),ty=p.y+dy*len;
    const k=1-d/3.4,r=(h.small?14:22)*(0.7+0.5*k);
    if(h.t==='cut')swoosh(tx+6,ty,k);
    burst(tx+4,ty,r,h.small?'#ffd27a':'#ffe45a');
  }
  // labels
  g.font='700 15px system-ui,sans-serif';g.textBaseline='middle';
  const lab=M.label;g.fillStyle='rgba(30,18,8,0.75)';const w=g.measureText(lab).width+22;g.beginPath();g.roundRect(8,8,w,28,6);g.fill();
  g.fillStyle='#fff2d6';g.fillText(lab,19,22);
  const ph=n<TJ?'GUARD':n<B_.TS-2?'JAB':n<B_.TS+14?'SLASH':'GUARD';
  const pw=g.measureText(ph).width+22;g.fillStyle='rgba(30,18,8,0.75)';g.beginPath();g.roundRect(659-pw,8,pw,28,6);g.fill();
  g.fillStyle='#ffd27a';g.fillText(ph,670-pw,22);
  g.font='700 20px system-ui,sans-serif';const cw=g.measureText(M.cap).width+30;
  g.fillStyle='rgba(30,18,8,0.82)';g.beginPath();g.roundRect(333.5-cw/2,332,cw,34,8);g.fill();
  g.fillStyle='#fff2d6';g.textAlign='center';g.fillText(M.cap,333.5,349);g.textAlign='left';
}
window.FRAMES=FRAMES;
window.setMode=m=>{MODE=m};
window.renderFrame=n=>{window.__rec=1;document.getElementById('tabs').style.display='none';cv.style.maxHeight='none';draw(n)};
const tabs=document.getElementById('tabs');
for(const k in MODES){const b=document.createElement('button');b.textContent={a:'A',b:'B',today:'TODAY',swords:'A SWORDS'}[k];b.dataset.k=k;
  b.onclick=()=>{MODE=k;t0=performance.now();sync()};tabs.appendChild(b);}
function sync(){for(const b of tabs.children)b.classList.toggle('on',b.dataset.k===MODE)}
const h=location.hash.slice(1);if(MODES[h])MODE=h;sync();
function loop(){if(!window.__rec){const n=((performance.now()-t0)/1000*FPS)%(FRAMES+12);draw(n)}requestAnimationFrame(loop)}
bg.onload=()=>{if(!window.__rec)draw(0)};loop();
})();
</script></body></html>
