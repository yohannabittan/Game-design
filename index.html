<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Game Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --card: #171b24; --line: #262c3a; --text: #e6e6e6; --muted: #9aa4b2; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: max(20px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    h1 { font-size: 24px; margin: 0; letter-spacing: 0.02em; }
    .hint { color: var(--muted); font-size: 13px; }
    a.card { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; color: inherit; text-decoration: none; }
    a.card:active { transform: scale(0.99); }
    .icon { width: 56px; height: 56px; border-radius: 14px; background: #222; object-fit: cover; }
    .title { font-size: 18px; font-weight: 700; }
    .status { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .go { color: var(--muted); font-size: 22px; }
    .foot { color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.5; }
    .empty { color: var(--muted); }
    a.release { display: none; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 16px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); font-size: 14px; text-decoration: none; }
    a.release.show { display: flex; }
  </style>
</head>
<body>
  <header><h1>Game Library</h1><span class="hint" id="count"></span></header>
  <a class="release" id="release" href="release/">Release build <span id="relver"></span> &rsaquo;</a>
  <div id="list"><div class="empty">Loading…</div></div>
  <p class="foot">Open a game, then use Share → Add to Home Screen. After one online launch each game plays offline. A game shows an update toast when a new version is ready.</p>
  <script>
    // release/release.json is written by tools/release.sh; the link shows only when a release exists.
    fetch('release/release.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(rel => {
      if (!rel || !rel.version) return;
      document.getElementById('relver').textContent = rel.version;
      document.getElementById('release').classList.add('show');
    }).catch(() => {});
    fetch('games/index.json', { cache: 'no-store' }).then(r => r.json()).then(games => {
      const el = document.getElementById('list');
      document.getElementById('count').textContent = games.length + (games.length === 1 ? ' game' : ' games');
      if (!games.length) { el.innerHTML = '<div class="empty">No games yet.</div>'; return; }
      el.innerHTML = games.map(g => `<a class="card" href="games/${g.slug}/">
        <img class="icon" src="games/${g.slug}/icons/icon-192.png" alt="">
        <div><div class="title">${g.title}</div><div class="status">${g.status || ''}</div></div>
        <div class="go">›</div></a>`).join('');
    }).catch(() => { document.getElementById('list').innerHTML = '<div class="empty">Could not load games/index.json</div>'; });
  </script>
</body>
</html>
