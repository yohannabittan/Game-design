<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Game Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0f1115; color: #e6e6e6; font-family: system-ui, -apple-system, sans-serif; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: #9aa4b2; margin: 0 0 20px; font-size: 14px; }
    a.card { display: block; background: #1a1f2a; border-radius: 14px; padding: 16px; margin-bottom: 12px; color: inherit; text-decoration: none; }
    a.card strong { display: block; font-size: 18px; }
    a.card span { color: #9aa4b2; font-size: 13px; }
    .empty { color: #9aa4b2; }
  </style>
</head>
<body>
  <h1>Game Library</h1>
  <p>Open a game, then use "Add to Home Screen" to play it offline.</p>
  <div id="list"><div class="empty">Loading…</div></div>
  <script>
    fetch('games/index.json', { cache: 'no-store' }).then(r => r.json()).then(games => {
      const el = document.getElementById('list');
      if (!games.length) { el.innerHTML = '<div class="empty">No games yet. Run tools/new-game.sh to create one.</div>'; return; }
      el.innerHTML = games.map(g => `<a class="card" href="games/${g.slug}/"><strong>${g.title}</strong><span>${g.status || ''}</span></a>`).join('');
    }).catch(() => { document.getElementById('list').innerHTML = '<div class="empty">Could not load games/index.json</div>'; });
  </script>
</body>
</html>
